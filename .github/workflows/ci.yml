name: DevFlow CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f README.md
          test -f .gitignore
          test -f docs/architecture.md
          test -f docs/git-workflow.md
          test -f CONTRIBUTING.md
          
      - name: CI success
        run: echo "DevFlow CI passed successfully"
